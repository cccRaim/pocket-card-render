<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Official MRT runtime sentinel</title>
<script type="importmap">
{
  "imports": {
    "three": "/vendor/three/build/three.module.js"
  }
}
</script>
<script>
  window.__mrtRuntimeState = { done: false, result: null, error: null };
  window.__finishMrtRuntime = (result, error) => {
    if (window.__mrtRuntimeState.done) return;
    window.__mrtRuntimeState = { done: true, result, error };
    document.getElementById("status").textContent = error ? error.message : "OK";
  };
  window.addEventListener("error", (event) => {
    window.__finishMrtRuntime(null, {
      message: event.error?.message || event.message || "module load failed",
      stack: event.error?.stack || "",
    });
  });
</script>
</head>
<body>
<pre id="status">running</pre>
<canvas id="three-target" width="8" height="8" hidden></canvas>
<canvas id="raw-sentinel" width="8" height="8" hidden></canvas>
<script type="module">
import * as THREE from "three";
import {
  OFFICIAL_MRT_DESCRIPTOR,
  assertOfficialMrtCapabilities,
  createOfficialMrtTarget,
  disposeOfficialMrtTarget,
  resizeOfficialMrtTarget,
} from "./render/pipeline/official-mrt.js";

function assert(condition, message) {
  if (!condition) throw new Error(message);
}

function assertPixel(actual, expected, tolerance, label) {
  assert(actual.length === expected.length, `${label}: channel count mismatch`);
  actual.forEach((value, index) => {
    assert(
      Math.abs(value - expected[index]) <= tolerance,
      `${label}: expected ${expected.join(",")}, got ${actual.join(",")}`,
    );
  });
}

function compileShader(gl, type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    const detail = gl.getShaderInfoLog(shader) || "unknown shader compile failure";
    gl.deleteShader(shader);
    throw new Error(detail);
  }
  return shader;
}

function createProgram(gl) {
  const vertex = compileShader(gl, gl.VERTEX_SHADER, `#version 300 es
    void main() {
      vec2 positions[3] = vec2[3](
        vec2(-1.0, -1.0),
        vec2(3.0, -1.0),
        vec2(-1.0, 3.0)
      );
      gl_Position = vec4(positions[gl_VertexID], 0.0, 1.0);
    }
  `);
  const fragment = compileShader(gl, gl.FRAGMENT_SHADER, `#version 300 es
    precision highp float;
    layout(location = 0) out vec4 outSceneColor;
    layout(location = 1) out vec4 outEmissive;
    void main() {
      outSceneColor = vec4(1.0, 0.0, 0.0, 0.5);
      outEmissive = vec4(0.0, 1.0, 0.0, 0.25);
    }
  `);
  const program = gl.createProgram();
  gl.attachShader(program, vertex);
  gl.attachShader(program, fragment);
  gl.linkProgram(program);
  gl.deleteShader(vertex);
  gl.deleteShader(fragment);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    const detail = gl.getProgramInfoLog(program) || "unknown program link failure";
    gl.deleteProgram(program);
    throw new Error(detail);
  }
  return program;
}

function inspectTargetFramebuffer(renderer, target) {
  const gl = renderer.getContext();
  renderer.setRenderTarget(target);
  const framebuffer = renderer.properties.get(target).__webglFramebuffer;
  assert(framebuffer, "three.js did not allocate the MRT framebuffer");
  gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);

  const status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
  assert(status === gl.FRAMEBUFFER_COMPLETE, `three.js MRT framebuffer status ${status}`);
  for (let index = 0; index < OFFICIAL_MRT_DESCRIPTOR.count; index += 1) {
    const objectType = gl.getFramebufferAttachmentParameter(
      gl.FRAMEBUFFER,
      gl.COLOR_ATTACHMENT0 + index,
      gl.FRAMEBUFFER_ATTACHMENT_OBJECT_TYPE,
    );
    assert(objectType === gl.TEXTURE, `three.js MRT attachment ${index} is not a texture`);
  }

  const depthObjectType = gl.getFramebufferAttachmentParameter(
    gl.FRAMEBUFFER,
    gl.DEPTH_STENCIL_ATTACHMENT,
    gl.FRAMEBUFFER_ATTACHMENT_OBJECT_TYPE,
  );
  assert(depthObjectType === gl.RENDERBUFFER, "three.js MRT depth/stencil is not a renderbuffer");
  const depthBuffer = gl.getFramebufferAttachmentParameter(
    gl.FRAMEBUFFER,
    gl.DEPTH_STENCIL_ATTACHMENT,
    gl.FRAMEBUFFER_ATTACHMENT_OBJECT_NAME,
  );
  gl.bindRenderbuffer(gl.RENDERBUFFER, depthBuffer);
  const depthInternalFormat = gl.getRenderbufferParameter(
    gl.RENDERBUFFER,
    gl.RENDERBUFFER_INTERNAL_FORMAT,
  );
  const samples = gl.getRenderbufferParameter(gl.RENDERBUFFER, gl.RENDERBUFFER_SAMPLES);
  assert(
    depthInternalFormat === gl.DEPTH24_STENCIL8,
    `three.js depth/stencil format ${depthInternalFormat}`,
  );
  assert(samples === OFFICIAL_MRT_DESCRIPTOR.samples, `three.js sample count ${samples}`);
  gl.bindRenderbuffer(gl.RENDERBUFFER, null);
  renderer.setRenderTarget(null);
  return { status, depthInternalFormat, samples };
}

function testThreeTarget() {
  const canvas = document.getElementById("three-target");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
  renderer.setSize(8, 8, false);
  const capabilities = assertOfficialMrtCapabilities(renderer);
  const target = createOfficialMrtTarget(renderer, 4, 3);
  let disposeEvents = 0;
  target.addEventListener("dispose", () => { disposeEvents += 1; });

  try {
    assert(target.textures.length === 2, `three.js MRT texture count ${target.textures.length}`);
    assert(target.samples === 0, `three.js MRT samples ${target.samples}`);
    assert(target.depthBuffer && target.stencilBuffer, "three.js MRT depth/stencil flags missing");
    target.textures.forEach((texture, index) => {
      assert(texture.format === THREE.RGBAFormat, `attachment ${index} format mismatch`);
      assert(texture.internalFormat === "RGBA8", `attachment ${index} internal format mismatch`);
      assert(texture.type === THREE.UnsignedByteType, `attachment ${index} type mismatch`);
      assert(texture.colorSpace === THREE.NoColorSpace, `attachment ${index} color space mismatch`);
      assert(texture.minFilter === THREE.NearestFilter, `attachment ${index} min filter mismatch`);
      assert(texture.magFilter === THREE.NearestFilter, `attachment ${index} mag filter mismatch`);
      assert(texture.generateMipmaps === false, `attachment ${index} mipmap state mismatch`);
      assert(
        texture.name === OFFICIAL_MRT_DESCRIPTOR.colorAttachments[index].name,
        `attachment ${index} name mismatch`,
      );
    });

    const initial = inspectTargetFramebuffer(renderer, target);
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const material = new THREE.RawShaderMaterial({
      glslVersion: THREE.GLSL3,
      vertexShader: `
        in vec3 position;
        uniform mat4 modelViewMatrix;
        uniform mat4 projectionMatrix;
        void main() { gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
      `,
      fragmentShader: `
        precision highp float;
        layout(location = 0) out vec4 outSceneColor;
        layout(location = 1) out vec4 outEmissive;
        void main() {
          outSceneColor = vec4(1.0, 0.0, 0.0, 0.5);
          outEmissive = vec4(0.0, 1.0, 0.0, 0.25);
        }
      `,
      transparent: true,
      blending: THREE.CustomBlending,
      blendEquation: THREE.AddEquation,
      blendSrc: THREE.SrcAlphaFactor,
      blendDst: THREE.OneMinusSrcAlphaFactor,
      blendSrcAlpha: THREE.OneFactor,
      blendDstAlpha: THREE.OneMinusSrcAlphaFactor,
      depthTest: false,
      depthWrite: false,
    });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
    scene.add(mesh);
    renderer.autoClear = false;
    renderer.setRenderTarget(target);
    const gl = renderer.getContext();
    gl.clearBufferfv(gl.COLOR, 0, new Float32Array([0, 0, 1, 1]));
    gl.clearBufferfv(gl.COLOR, 1, new Float32Array([1, 0, 1, 1]));
    renderer.render(scene, camera);
    gl.finish();
    const drawRt0 = readAttachment(gl, 0);
    const drawRt1 = readAttachment(gl, 1);
    assertPixel(drawRt0, [128, 0, 128, 255], 1, "three MRT RT0 alpha blend");
    assertPixel(drawRt1, [191, 64, 191, 255], 1, "three MRT RT1 shared alpha blend");
    renderer.setRenderTarget(null);
    mesh.geometry.dispose();
    material.dispose();
    resizeOfficialMrtTarget(target, 7, 5);
    assert(target.width === 7 && target.height === 5, "MRT resize dimensions mismatch");
    target.textures.forEach((texture, index) => {
      assert(
        texture.image.width === 7 && texture.image.height === 5,
        `attachment ${index} resize mismatch`,
      );
    });
    const resized = inspectTargetFramebuffer(renderer, target);
    assert(disposeEvents === 1, `resize dispatched ${disposeEvents} dispose events`);
    assert(disposeOfficialMrtTarget(target) === true, "first MRT dispose did not run");
    assert(disposeOfficialMrtTarget(target) === false, "MRT dispose was not idempotent");
    assert(disposeEvents === 2, `lifecycle dispatched ${disposeEvents} dispose events`);

    return {
      capabilities: {
        isWebGL2: capabilities.isWebGL2,
        maxDrawBuffers: capabilities.maxDrawBuffers,
        maxColorAttachments: capabilities.maxColorAttachments,
        threeRevision: capabilities.threeRevision,
      },
      initial,
      resized,
      disposeEvents,
      draw: { rt0: drawRt0, rt1: drawRt1 },
    };
  } finally {
    disposeOfficialMrtTarget(target);
    renderer.dispose();
  }
}

function makeColorTexture(gl, width, height) {
  const texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, width, height);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return texture;
}

function readAttachment(gl, index) {
  const pixel = new Uint8Array(4);
  gl.readBuffer(gl.COLOR_ATTACHMENT0 + index);
  gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
  return Array.from(pixel);
}

function runRawSentinel() {
  const canvas = document.getElementById("raw-sentinel");
  const gl = canvas.getContext("webgl2", {
    alpha: true,
    antialias: false,
    depth: true,
    stencil: true,
    preserveDrawingBuffer: false,
  });
  assert(gl, "raw WebGL2 context unavailable");
  const capabilities = assertOfficialMrtCapabilities(gl);
  assert(capabilities.maxDrawBuffers >= 2, "MAX_DRAW_BUFFERS is below 2");
  assert(capabilities.maxColorAttachments >= 2, "MAX_COLOR_ATTACHMENTS is below 2");

  const textures = [];
  let framebuffer = null;
  let depthStencil = null;
  let program = null;
  let vertexArray = null;
  try {
    textures.push(makeColorTexture(gl, 2, 2), makeColorTexture(gl, 2, 2));
    depthStencil = gl.createRenderbuffer();
    gl.bindRenderbuffer(gl.RENDERBUFFER, depthStencil);
    gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH24_STENCIL8, 2, 2);
    const depthInternalFormat = gl.getRenderbufferParameter(
      gl.RENDERBUFFER,
      gl.RENDERBUFFER_INTERNAL_FORMAT,
    );
    const samples = gl.getRenderbufferParameter(gl.RENDERBUFFER, gl.RENDERBUFFER_SAMPLES);
    assert(depthInternalFormat === gl.DEPTH24_STENCIL8, "raw depth/stencil format mismatch");
    assert(samples === 0, `raw sample count ${samples}`);

    framebuffer = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
    textures.forEach((texture, index) => {
      gl.framebufferTexture2D(
        gl.FRAMEBUFFER,
        gl.COLOR_ATTACHMENT0 + index,
        gl.TEXTURE_2D,
        texture,
        0,
      );
    });
    gl.framebufferRenderbuffer(
      gl.FRAMEBUFFER,
      gl.DEPTH_STENCIL_ATTACHMENT,
      gl.RENDERBUFFER,
      depthStencil,
    );
    gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
    const framebufferStatus = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
    assert(
      framebufferStatus === gl.FRAMEBUFFER_COMPLETE,
      `raw MRT framebuffer status ${framebufferStatus}`,
    );

    gl.disable(gl.DEPTH_TEST);
    gl.disable(gl.STENCIL_TEST);
    gl.disable(gl.SCISSOR_TEST);
    gl.disable(gl.DITHER);
    gl.viewport(0, 0, 2, 2);
    gl.clearBufferfv(gl.COLOR, 0, new Float32Array([0, 0, 1, 1]));
    gl.clearBufferfv(gl.COLOR, 1, new Float32Array([1, 0, 1, 1]));
    gl.enable(gl.BLEND);
    gl.blendEquationSeparate(gl.FUNC_ADD, gl.FUNC_ADD);
    gl.blendFuncSeparate(
      gl.SRC_ALPHA,
      gl.ONE_MINUS_SRC_ALPHA,
      gl.ONE,
      gl.ONE_MINUS_SRC_ALPHA,
    );
    gl.colorMask(true, true, true, true);

    program = createProgram(gl);
    vertexArray = gl.createVertexArray();
    gl.bindVertexArray(vertexArray);
    gl.useProgram(program);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.finish();

    const rt0 = readAttachment(gl, 0);
    const rt1 = readAttachment(gl, 1);
    assertPixel(rt0, [128, 0, 128, 255], 1, "RT0 alpha blend");
    assertPixel(rt1, [191, 64, 191, 255], 1, "RT1 shared alpha blend");
    assert(rt0.join(",") !== rt1.join(","), "MRT attachments are not independent");
    const error = gl.getError();
    assert(error === gl.NO_ERROR, `raw WebGL2 error ${error}`);

    return {
      framebufferStatus,
      maxDrawBuffers: capabilities.maxDrawBuffers,
      maxColorAttachments: capabilities.maxColorAttachments,
      depthInternalFormat,
      samples,
      rt0,
      rt1,
    };
  } finally {
    gl.disable(gl.BLEND);
    gl.useProgram(null);
    gl.bindVertexArray(null);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.bindRenderbuffer(gl.RENDERBUFFER, null);
    gl.bindTexture(gl.TEXTURE_2D, null);
    if (vertexArray) gl.deleteVertexArray(vertexArray);
    if (program) gl.deleteProgram(program);
    if (framebuffer) gl.deleteFramebuffer(framebuffer);
    if (depthStencil) gl.deleteRenderbuffer(depthStencil);
    textures.forEach((texture) => gl.deleteTexture(texture));
  }
}

async function run() {
  const target = testThreeTarget();
  const sentinel = runRawSentinel();
  return { target, sentinel };
}

run().then(
  (result) => window.__finishMrtRuntime(result, null),
  (error) => window.__finishMrtRuntime(null, {
    message: error.message || String(error),
    stack: error.stack || "",
  }),
);
</script>
</body>
</html>
