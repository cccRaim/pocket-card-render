<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shader precision runtime probe</title>
</head>
<body>
<canvas id="probe" width="1" height="1" hidden></canvas>
<script>
(() => {
  "use strict";
  const state = window.__shaderPrecisionRuntimeState = { done: false, result: null, error: null };

  function fail(message) {
    throw new Error(message);
  }

  function compile(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(shader);
      gl.deleteShader(shader);
      fail(`shader compile failed: ${log}\n${source}`);
    }
    return shader;
  }

  function link(gl, vertexSource, fragmentSource, varyings) {
    const program = gl.createProgram();
    const vertex = compile(gl, gl.VERTEX_SHADER, vertexSource);
    const fragment = compile(gl, gl.FRAGMENT_SHADER, fragmentSource);
    gl.attachShader(program, vertex);
    gl.attachShader(program, fragment);
    if (varyings) gl.transformFeedbackVaryings(program, varyings, gl.INTERLEAVED_ATTRIBS);
    gl.linkProgram(program);
    gl.deleteShader(vertex);
    gl.deleteShader(fragment);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      const log = gl.getProgramInfoLog(program);
      gl.deleteProgram(program);
      fail(`program link failed: ${log}`);
    }
    return program;
  }

  const CASES = [
    {
      name: "mantissa-and-range",
      input: [2 ** -11, 2 ** -12, 1, 2048],
      expression: `
        float one = x.z;
        float big = x.w;
        result = vec4((one + x.x) - one, (one + x.y) - one, (big + one) - big, big * big);`,
    },
    {
      name: "shader-operation-chain",
      input: [0.3123456, 0.9234567, 0.5001, 0.5101],
      expression: `
        float parallax = (x.x * 0.5) / (x.y + 0.42);
        float holo = pow(clamp(x.z, 0.0, 1.0), 64.0);
        float wave = sin(x.x * 6.283185307179586);
        float angular = atan(x.y, x.x) * 0.125;
        float tiled = fract((x.w * 31.0) + 0.12345);
        result = vec4(parallax, holo, (wave * wave) + angular, tiled);`,
    },
  ];

  function vertexProbe(gl, precision, testCase) {
    const vertexSource = `#version 300 es
precision ${precision} float;
precision highp int;
layout(location = 0) in highp vec4 aInput;
out highp vec4 vResult;
void main() {
  vec4 x = aInput;
  vec4 result;
  ${testCase.expression}
  vResult = result;
  gl_Position = vec4(0.0, 0.0, 0.0, 1.0);
}`;
    const fragmentSource = `#version 300 es
precision highp float;
out highp vec4 outColor;
void main() { outColor = vec4(0.0); }`;
    const program = link(gl, vertexSource, fragmentSource, ["vResult"]);
    const vao = gl.createVertexArray();
    const input = gl.createBuffer();
    const output = gl.createBuffer();
    const feedback = gl.createTransformFeedback();
    gl.bindVertexArray(vao);
    gl.bindBuffer(gl.ARRAY_BUFFER, input);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(testCase.input), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 4, gl.FLOAT, false, 0, 0);
    gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, feedback);
    gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, output);
    gl.bufferData(gl.TRANSFORM_FEEDBACK_BUFFER, 4 * Float32Array.BYTES_PER_ELEMENT, gl.STREAM_READ);
    gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, output);
    gl.useProgram(program);
    gl.enable(gl.RASTERIZER_DISCARD);
    gl.beginTransformFeedback(gl.POINTS);
    gl.drawArrays(gl.POINTS, 0, 1);
    gl.endTransformFeedback();
    gl.disable(gl.RASTERIZER_DISCARD);
    const result = new Float32Array(4);
    gl.getBufferSubData(gl.TRANSFORM_FEEDBACK_BUFFER, 0, result);
    gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, null);
    gl.bindVertexArray(null);
    gl.deleteTransformFeedback(feedback);
    gl.deleteBuffer(output);
    gl.deleteBuffer(input);
    gl.deleteVertexArray(vao);
    gl.deleteProgram(program);
    return Array.from(result);
  }

  function fragmentProbe(gl, precision, testCase) {
    const vertexSource = `#version 300 es
precision highp float;
void main() {
  vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  gl_Position = vec4((p * 2.0) - 1.0, 0.0, 1.0);
}`;
    const fragmentSource = `#version 300 es
precision ${precision} float;
precision highp int;
uniform highp vec4 uInput;
layout(location = 0) out highp vec4 outColor;
void main() {
  vec4 x = uInput;
  vec4 result;
  ${testCase.expression}
  outColor = result;
}`;
    const program = link(gl, vertexSource, fragmentSource);
    const texture = gl.createTexture();
    const framebuffer = gl.createFramebuffer();
    const vao = gl.createVertexArray();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, 1, 1, 0, gl.RGBA, gl.FLOAT, null);
    gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
    gl.drawBuffers([gl.COLOR_ATTACHMENT0]);
    const status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
    if (status !== gl.FRAMEBUFFER_COMPLETE) fail(`RGBA32F framebuffer incomplete: 0x${status.toString(16)}`);
    gl.bindVertexArray(vao);
    gl.useProgram(program);
    gl.uniform4fv(gl.getUniformLocation(program, "uInput"), testCase.input);
    gl.viewport(0, 0, 1, 1);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    const result = new Float32Array(4);
    gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.FLOAT, result);
    const error = gl.getError();
    if (error !== gl.NO_ERROR) fail(`fragment float readback failed: 0x${error.toString(16)}`);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.bindVertexArray(null);
    gl.deleteVertexArray(vao);
    gl.deleteFramebuffer(framebuffer);
    gl.deleteTexture(texture);
    gl.deleteProgram(program);
    return Array.from(result);
  }

  function precisionFormat(gl, stage, precision) {
    const format = gl.getShaderPrecisionFormat(stage, precision);
    return format ? { rangeMin: format.rangeMin, rangeMax: format.rangeMax, precision: format.precision } : null;
  }

  function compare(mediump, highp) {
    const absDiff = mediump.map((value, index) => Math.abs(value - highp[index]));
    return {
      mediump,
      highp,
      absDiff,
      maxAbsDiff: Math.max(...absDiff),
      exactMatch: absDiff.every((value) => value === 0),
    };
  }

  async function run() {
    const gl = document.getElementById("probe").getContext("webgl2", {
      antialias: false,
      depth: false,
      stencil: false,
      preserveDrawingBuffer: false,
    });
    if (!gl) fail("WebGL2 is unavailable");
    const floatColorBuffer = Boolean(gl.getExtension("EXT_color_buffer_float"));
    if (!floatColorBuffer) fail("EXT_color_buffer_float is unavailable");
    const debug = gl.getExtension("WEBGL_debug_renderer_info");
    const runtime = {
      vendor: gl.getParameter(gl.VENDOR),
      renderer: gl.getParameter(gl.RENDERER),
      version: gl.getParameter(gl.VERSION),
      shadingLanguageVersion: gl.getParameter(gl.SHADING_LANGUAGE_VERSION),
      unmaskedVendor: debug ? gl.getParameter(debug.UNMASKED_VENDOR_WEBGL) : null,
      unmaskedRenderer: debug ? gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) : null,
      floatColorBuffer,
    };
    runtime.swiftShader = /SwiftShader/i.test(`${runtime.renderer} ${runtime.unmaskedRenderer || ""}`);
    const precisionFormats = {};
    for (const [name, stage] of [["vertex", gl.VERTEX_SHADER], ["fragment", gl.FRAGMENT_SHADER]]) {
      precisionFormats[name] = {
        lowFloat: precisionFormat(gl, stage, gl.LOW_FLOAT),
        mediumFloat: precisionFormat(gl, stage, gl.MEDIUM_FLOAT),
        highFloat: precisionFormat(gl, stage, gl.HIGH_FLOAT),
        lowInt: precisionFormat(gl, stage, gl.LOW_INT),
        mediumInt: precisionFormat(gl, stage, gl.MEDIUM_INT),
        highInt: precisionFormat(gl, stage, gl.HIGH_INT),
      };
    }
    const probes = [];
    for (const testCase of CASES) {
      const vertexMediump = vertexProbe(gl, "mediump", testCase);
      const vertexHighp = vertexProbe(gl, "highp", testCase);
      const fragmentMediump = fragmentProbe(gl, "mediump", testCase);
      const fragmentHighp = fragmentProbe(gl, "highp", testCase);
      probes.push({
        name: testCase.name,
        input: testCase.input,
        vertex: compare(vertexMediump, vertexHighp),
        fragment: compare(fragmentMediump, fragmentHighp),
      });
    }
    const allExact = probes.every((probe) => probe.vertex.exactMatch && probe.fragment.exactMatch);
    return {
      runtime,
      precisionFormats,
      probes,
      classification: {
        observationScope: "current-WebGL2-backend-only",
        mediumpMatchesHighpForTheseProbes: allExact,
        swiftShaderFp32LikePromotionObserved: runtime.swiftShader && allExact,
        backendConditional: true,
        officialTargetGpuInference: false,
        note: "SwiftShader FP32-like mediump behavior is a backend-conditional observation, not evidence about the official Android target GPU or driver.",
      },
      screenshots: 0,
    };
  }

  run().then((result) => {
    state.result = result;
    state.done = true;
  }).catch((error) => {
    state.error = { message: error.message || String(error), stack: error.stack || "" };
    state.done = true;
  });
})();
</script>
</body>
</html>
