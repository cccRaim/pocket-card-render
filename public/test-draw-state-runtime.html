<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebGL draw-state runtime audit</title>
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="draw-state" width="8" height="8"></canvas>
<pre id="draw-state-status">loading</pre>
<script>
window.__drawStateRuntimeState = { done: false, result: null, error: null };
document.getElementById("draw-state-status").textContent = "loader-start";
import("./test-draw-state-runtime.js").catch((error) => {
  window.__drawStateRuntimeState = {
    done: true,
    result: null,
    error: error?.stack ?? error?.message ?? String(error),
  };
  document.getElementById("draw-state-status").textContent =
    JSON.stringify(window.__drawStateRuntimeState, null, 2);
});
</script>
</body>
</html>
